<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10K - Checkboxes</title>

<style>
  body {
    background-color: black;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  #login-container {
    text-align: center;
    margin-top: 100px;
  }

  #checkboxes-container {
    display: none;
    position: relative;
  }

  button {
    background-color: #4CAF50;
    color: white;
    padding: 15px 32px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    border-radius: 4px;
  }

  button:hover {
    background-color: #45a049;
  }

  input[type="checkbox"] {
    margin: 2px;
  }

  #logout-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: #f44336;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #logout-btn:hover {
    background-color: #d32f2f;
  }

  #container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(20px, 1fr));
    gap: 4px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    margin-top: 50px;
  }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #323232;
    color: white;
    padding: 12px 24px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 1000;
  }

  #toast.show {
    opacity: 1;
  }
</style>
  </head>

  <body>
<div id="login-container">
  <h1>10K - Checkboxes</h1>
  <p>Please login to access the checkboxes</p>
  <button onclick="window.location.href='/login'">Login</button>
</div>

<div id="checkboxes-container">
  <h1>10K - Checkboxes</h1>
  <button id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
  <div id="container"></div>
    </div>

    <div id="toast"></div>

    <script src="/socket.io/socket.io.js"></script>

<script>
  let socket;
  let isAuthenticated = false;
  let appInitialized = false;
  const BATCH_SIZE = 200;
  let currentBatchIndex = 0;

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");

    let hideTimeout = 5000;
    const remainingMatch = message.match(/wait (\d+) more seconds/);
    if (remainingMatch) {
      hideTimeout = parseInt(remainingMatch[1]) * 1000;
    }

    setTimeout(() => {
      toast.classList.remove("show");
    }, hideTimeout);
  }

  async function checkAuth() {
    try {
      const response = await fetch("/auth/me", { method: "GET" });
      const data = await response.json();

      if (response.ok && data.authenticated) {
        isAuthenticated = true;
        document.getElementById("login-container").style.display = "none";
        document.getElementById("checkboxes-container").style.display = "block";
        initApp();
      } else {
        isAuthenticated = false;
        document.getElementById("login-container").style.display = "block";
        document.getElementById("checkboxes-container").style.display = "none";
      }
    } catch (error) {
      console.error("Auth check error:", error);
    }
  }

  function initApp() {
    if (appInitialized) {
      return;
    }

    appInitialized = true;
    socket = io();

    socket.on("server:checkbox:change", (data) => {
      console.log(`server event `, data);
      const { index, checked } = data;
      const input = document.getElementById(`checkbox-${index}`);
      if (input) {
        input.checked = checked;
      }
    });

    socket.on("server:error", (errorData) => {
      showToast(errorData.message);
      if (errorData.data && errorData.data.index !== undefined) {
        const checkbox = document.getElementById(`checkbox-${errorData.data.index}`);
        if (checkbox) {
          checkbox.checked = !errorData.data.checked;
        }
      }
    });

    loadCheckboxes();
  }

  async function loadCheckboxes() {
    const container = document.getElementById("container");
    container.innerHTML = "";

    try {
      const response = await fetch("/checkboxes", { method: "GET" });
      if (response.status === 401) {
        appInitialized = false;
        isAuthenticated = false;
        document.getElementById("login-container").style.display = "block";
        document.getElementById("checkboxes-container").style.display = "none";
        return;
      }

      const data = await response.json();
      if (data && data.checkboxes) {
        window.checkboxStates = data.checkboxes;
        currentBatchIndex = 0;
        scheduleNextBatch(container, data.checkboxes);
      }
    } catch (error) {
      console.error("Checkbox load failed:", error);
    }
  }

  function scheduleNextBatch(container, checkboxStates) {
    requestAnimationFrame(() => {
      const fragment = document.createDocumentFragment();
      const end = Math.min(currentBatchIndex + BATCH_SIZE, checkboxStates.length);

      for (let i = currentBatchIndex; i < end; i++) {
        const input = document.createElement("input");
        input.id = `checkbox-${i}`;
        input.type = "checkbox";
        input.checked = checkboxStates[i];

        input.addEventListener("change", (function(index) {
          return function(event) {
            const checked = event.target.checked;
            socket.emit("client:checkbox:change", { index, checked });
          };
        })(i));

        fragment.appendChild(input);
      }

      container.appendChild(fragment);
      currentBatchIndex = end;

      if (currentBatchIndex < checkboxStates.length) {
        scheduleNextBatch(container, checkboxStates);
      }
    });
  }

  checkAuth();
</script>
  </body>
</html>
